<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#647A90"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="64" y="80" font-family="Arial" font-size="42" font-weight="700" fill="#172B43">Payment success | Order unavailable for 30 seconds</text><text x="64" y="126" font-family="Arial" font-size="23" font-weight="400" fill="#4A6178">Keep durable facts, retry delivery, and make every business effect idempotent.</text><rect x="80" y="255" width="370" height="160" rx="10" fill="#F1F3F5" stroke="#647A90" stroke-width="1.5"/><text x="100" y="293" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Provider</text><text x="100" y="328.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Charge succeeds</text><path d="M 450,335 L 535,335" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="535,335 523.0,330.0 523.0,340.0" fill="#647A90"/><rect x="535" y="255" width="370" height="160" rx="10" fill="#EEE7F8" stroke="#647A90" stroke-width="1.5"/><text x="555" y="293" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Payment DB</text><text x="555" y="328.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Success + outbox</text><path d="M 905,335 L 990,335" fill="none" stroke="#647A90" stroke-width="2" stroke-dasharray="8,6"/><polygon points="990,335 978.0,330.0 978.0,340.0" fill="#647A90"/><rect x="990" y="255" width="370" height="160" rx="10" fill="#EEE7F8" stroke="#647A90" stroke-width="1.5"/><text x="1010" y="293" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Inventory DB</text><text x="1010" y="328.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Inbox + SOLD + outbox</text><path d="M 1360,335 L 1445,335" fill="none" stroke="#647A90" stroke-width="2" stroke-dasharray="8,6"/><polygon points="1445,335 1433.0,330.0 1433.0,340.0" fill="#647A90"/><rect x="1445" y="255" width="370" height="160" rx="10" fill="#EEE7F8" stroke="#647A90" stroke-width="1.5"/><text x="1465" y="293" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Order DB</text><text x="1465" y="328.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Inbox + unique order</text><text x="830" y="460" font-family="Arial" font-size="22" font-weight="400" fill="#172B43">PaymentSucceeded</text><text x="1285" y="460" font-family="Arial" font-size="22" font-weight="400" fill="#172B43">ReservationCommitted</text><rect x="80" y="585" width="530" height="215" rx="10" fill="#FCE5DF" stroke="#647A90" stroke-width="1.5"/><text x="100" y="623" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Lost gateway response</text><text x="100" y="658.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Lookup the same provider intent. Never</text><text x="100" y="686.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">create a new key or switch provider while</text><text x="100" y="714.7" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">UNKNOWN.</text><rect x="695" y="585" width="530" height="215" rx="10" fill="#DDEBFF" stroke="#647A90" stroke-width="1.5"/><text x="715" y="623" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Order down for 30s</text><text x="715" y="658.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Retain event in outbox / Kafka. Customer</text><text x="715" y="686.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">sees payment received, order processing.</text><rect x="1310" y="585" width="530" height="215" rx="10" fill="#DDF2E4" stroke="#647A90" stroke-width="1.5"/><text x="1330" y="623" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">After restart</text><text x="1330" y="658.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Create one confirmed order. Commit before</text><text x="1330" y="686.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">ACK; duplicate delivery changes nothing.</text><text x="80" y="905" font-family="Arial" font-size="32" font-weight="700" fill="#172B43">An Order outage is not a reason to refund a valid purchase.</text><text x="80" y="960" font-family="Arial" font-size="24" font-weight="400" fill="#172B43">Refund only for confirmed cancellation or permanent inability to fulfil, with its own durable key.</text><text x="80" y="1025" font-family="Arial" font-size="22" font-weight="400" fill="#4A6178">No global transaction: each DB commits locally; durable events and reconciliation connect the steps.</text></svg>