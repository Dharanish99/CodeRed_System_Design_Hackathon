fill="#172B43">Order DB</text><text x="1600" y="833.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Owned PostgreSQL</text><path d="M 1715,595 L 1715,760" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="1715,760 1720.0,748.0 1710.0,748.0" fill="#647A90"/><rect x="1690.5" y="652.5" width="49" height="28" fill="white"/><text x="1698.5" y="672.5" font-family="Arial" font-size="19" font-weight="400" fill="#172B43">SQL</text><path d="M 1060,313 L 1060,370 L 1060,410" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="1060,410 1065.0,398.0 1055.0,398.0" fill="#647A90"/><rect x="1024.5" y="336.5" width="71" height="28" fill="white"/><text x="1032.5" y="356.5" font-family="Arial" font-size="19" font-weight="400" fill="#172B43">route</text><text x="80" y="635" font-family="Arial" font-size="22" font-weight="400" fill="#172B43">Checkout calls Inventory and Payment synchronously; Order reads are routed independently.</text><rect x="80" y="1020" width="520" height="125" rx="10" fill="#EEE7F8" stroke="#647A90" stroke-width="1.5"/><text x="100" y="1058" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Kafka + relay + retry + DLQ</text><text x="100" y="1093.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">DB outboxes publish; consumers commit inbox</text><text x="100" y="1121.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">+ effects before ACK.</text><rect x="690" y="1020" width="360" height="125" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="710" y="1058" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Fulfilment /</text><text x="710" y="1088" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Notification</text><text x="710" y="1123.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Own shipment / notice stores</text><rect x="1140" y="1020" width="680" height="125" rx="10" fill="#F1F3F