<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#647A90"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="64" y="80" font-family="Arial" font-size="42" font-weight="700" fill="#172B43">10,000 customers compete for 100 units</text><text x="64" y="126" font-family="Arial" font-size="23" font-weight="400" fill="#4A6178">The invariant is live held units + sold units &lt;= 100. Expired or failed holds may be reused.</text><rect x="80" y="200" width="510" height="195" rx="10" fill="#FFF1CE" stroke="#647A90" stroke-width="1.5"/><text x="100" y="238" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Logical customers</text><text x="105" y="340" font-family="Arial" font-size="76" font-weight="700" fill="#172B43">10,000</text><rect x="705" y="200" width="510" height="195" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="725" y="238" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Available allocation</text><text x="730" y="340" font-family="Arial" font-size="76" font-weight="700" fill="#172B43">100</text><rect x="1330" y="200" width="510" height="195" rx="10" fill="#DDF2E4" stroke="#647A90" stroke-width="1.5"/><text x="1350" y="238" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Maximum live held + sold</text><text x="1355" y="340" font-family="Arial" font-size="76" font-weight="700" fill="#172B43">100</text><rect x="80" y="510" width="390" height="160" rx="10" fill="#DDEBFF" stroke="#647A90" stroke-width="1.5"/><text x="100" y="548" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Bound admission</text><text x="100" y="583.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">429 beyond the safe budget</text><path d="M 470,590 L 535,590" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="535,590 523.0,585.0 523.0,595.0" fill="#647A90"/><rect x="535" y="510" width="390" height="160" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="555" y="548" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Claim request key</text><text x="555" y="583.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Replay the original response</text><path d="M 925,590 L 990,590" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="990,590 978.0,585.0 978.0,595.0" fill="#647A90"/><rect x="990" y="510" width="390" height="160" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="1010" y="548" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Guarded SQL</text><text x="1010" y="583.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">UPDATE ... WHERE available &gt;= 1</text><path d="M 1380,590 L 1445,590" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="1445,590 1433.0,585.0 1433.0,595.0" fill="#647A90"/><rect x="1445" y="510" width="390" height="160" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="1465" y="548" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Commit hold</text><text x="1465" y="583.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Stock + hold + outbox + reply</text><text x="80" y="765" font-family="Arial" font-size="27" font-weight="700" fill="#172B43">First wave: 100 holds; 9,900 out-of-stock outcomes if all are admitted before releases.</text><rect x="80" y="820" width="820" height="150" rx="10" fill="#DDF2E4" stroke="#647A90" stroke-width="1.5"/><text x="100" y="858" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">95 successful payments</text><text x="100" y="893.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Held -&gt; sold; eventually 95 unique confirmed orders.</text><rect x="990" y="820" width="850" height="150" rx="10" fill="#FCE5DF" stroke="#647A90" stroke-width="1.5"/><text x="1010" y="858" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">5 definitive failures</text><text x="1010" y="893.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Held -&gt; available. A later wave can buy those five units.</text><text x="80" y="1030" font-family="Arial" font-size="22" font-weight="400" fill="#4A6178">Numbers are the brief&#x27;s practical scenario, exercised in a state model; no throughput claim.</text></svg>