<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#647A90"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="64" y="80" font-family="Arial" font-size="42" font-weight="700" fill="#172B43">Deployment | One active region, fenced stock writers</text><text x="64" y="126" font-family="Arial" font-size="23" font-weight="400" fill="#4A6178">Scale independent work across zones and shards. Stop writes when safe leadership cannot be established.</text><rect x="80" y="210" width="1760" height="105" rx="10" fill="#DDEBFF" stroke="#647A90" stroke-width="1.5"/><text x="100" y="248" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Global CDN / WAF -&gt; regional load balancer / API Gateway</text><rect x="80" y="395" width="540" height="200" rx="10" fill="#DDF3F0" stroke="#647A90" stroke-width="1.5"/><text x="100" y="433" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">AZ A</text><text x="100" y="468.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Stateless API replicas + workers; bounded</text><text x="100" y="496.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">connections; private application network.</text><rect x="690" y="395" width="540" height="200" rx="10" fill="#DDF3F0" stroke="#647A90" stroke-width="1.5"/><text x="710" y="433" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">AZ B</text><text x="710" y="468.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Stateless API replicas + workers; bounded</text><text x="710" y="496.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">connections; private application network.</text><rect x="1300" y="395" width="540" height="200" rx="10" fill="#DDF3F0" stroke="#647A90" stroke-width="1.5"/><text x="1320" y="433" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">AZ C</text><text x="1320" y="468.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Stateless API replicas + workers; bounded</text><text x="1320" y="496.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">connections; private application network.</text><rect x="80" y="690" width="840" height="230" rx="10" fill="#EEE7F8" stroke="#647A90" stroke-width="1.5"/><text x="100" y="728" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">PostgreSQL ownership domains</text><text x="100" y="763.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">One primary per shard + synchronous replica in another AZ. Fence old</text><text x="100" y="791.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">writer before promotion. Stock decisions use writer.</text><rect x="1010" y="690" width="830" height="230" rx="10" fill="#EEE7F8" stroke="#647A90" stroke-width="1.5"/><text x="1030" y="728" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Kafka + Redis + operations</text><text x="1030" y="763.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Kafka3 replicas; retry / DLQ. Redis is advisory. Secret manager, TLS,</text><text x="1030" y="791.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">metrics, logs, traces and backups.</text><text x="80" y="1020" font-family="Arial" font-size="24" font-weight="700" fill="#172B43">Targets: in-region acknowledged-write RPO0 and RTO&lt;60s. Neither has been demonstrated here.</text></svg>