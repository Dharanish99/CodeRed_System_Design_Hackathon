<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#647A90"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="64" y="80" font-family="Arial" font-size="42" font-weight="700" fill="#172B43">Failure and recovery | Preserve the business fact</text><text x="64" y="126" font-family="Arial" font-size="23" font-weight="400" fill="#4A6178">Failures reduce availability; they do not change the authority or permit an unsafe retry.</text><rect x="80" y="235" width="430" height="120" rx="10" fill="#FCE5DF" stroke="#647A90" stroke-width="1.5"/><text x="100" y="273" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Inventory DB outage</text><rect x="605" y="235" width="900" height="120" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="625" y="273" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Stop writes; resolve unknown commits by the original key.</text><rect x="1600" y="235" width="240" height="120" rx="10" fill="#DDF2E4" stroke="#647A90" stroke-width="1.5"/><text x="1620" y="273" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Fenced recovery</text><path d="M 510,295 L 605,295" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="605,295 593.0,290.0 593.0,300.0" fill="#647A90"/><path d="M 1505,295 L 1600,295" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="1600,295 1588.0,290.0 1588.0,300.0" fill="#647A90"/><rect x="80" y="410" width="430" height="120" rx="10" fill="#FCE5DF" stroke="#647A90" stroke-width="1.5"/><text x="100" y="448" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Payment timeout</text><rect x="605" y="410" width="900" height="120" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="625" y="448" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Keep PAYMENT_PENDING stock; query the same intent.</text><rect x="1600" y="410" width="240" height="120" rx="10" fill="#DDF2E4" stroke="#647A90" stroke-width="1.5"/><text x="1620" y="448" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">No timeout</text><text x="1620" y="478" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">release</text><path d="M 510,470 L 605,470" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="605,470 593.0,465.0 593.0,475.0" fill="#647A90"/><path d="M 1505,470 L 1600,470" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="1600,470 1588.0,465.0 1588.0,475.0" fill="#647A90"/><rect x="80" y="585" width="430" height="120" rx="10" fill="#FCE5DF" stroke="#647A90" stroke-width="1.5"/><text x="100" y="623" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Broker / Order outage</text><rect x="605" y="585" width="900" height="120" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="625" y="623" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Persist outbox; replay inbox + unique business effects.</text><rect x="1600" y="585" width="240" height="120" rx="10" fill="#DDF2E4" stroke="#647A90" stroke-width="1.5"/><text x="1620" y="623" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">No duplicate</text><text x="1620" y="653" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">order</text><path d="M 510,645 L 605,645" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="605,645 593.0,640.0 593.0,650.0" fill="#647A90"/><path d="M 1505,645 L 1600,645" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="1600,645 1588.0,640.0 1588.0,650.0" fill="#647A90"/><rect x="80" y="760" width="430" height="120" rx="10" fill="#FCE5DF" stroke="#647A90" stroke-width="1.5"/><text x="100" y="798" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Poison event / contradiction</text><rect x="605" y="760" width="900" height="120" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="625" y="798" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Quarantine, alert, inspect source, repair and replay.</text><rect x="1600" y="760" width="240" height="120" rx="10" fill="#DDF2E4" stroke="#647A90" stroke-width="1.5"/><text x="1620" y="798" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">No silent</text><text x="1620" y="828" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">discard</text><path d="M 510,820 L 605,820" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="605,820 593.0,815.0 593.0,825.0" fill="#647A90"/><path d="M 1505,820 L 1600,820" fill="none" stroke="#647A90" stroke-width="2"/><polygon points="1600,820 1588.0,815.0 1588.0,825.0" fill="#647A90"/><text x="80" y="1015" font-family="Arial" font-size="23" font-weight="400" fill="#4A6178">Conditional liveness: permanent provider failure can require operator resolution; stock remains protected.</text></svg>