<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#647A90"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="64" y="80" font-family="Arial" font-size="42" font-weight="700" fill="#172B43">Inventory reservation | The critical section</text><text x="64" y="126" font-family="Arial" font-size="23" font-weight="400" fill="#4A6178">PostgreSQL is authoritative. No cache check or external provider call can grant stock.</text><rect x="80" y="210" width="1760" height="410" rx="10" fill="#EEE7F8" stroke="#647A90" stroke-width="1.5"/><text x="100" y="248" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">ONE LOCAL TRANSACTION</text><text x="115" y="315" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">1. Claim</text><text x="330" y="315" font-family="Arial" font-size="25" font-weight="400" fill="#172B43">UNIQUE principal + operation + key; verify request hash</text><text x="115" y="385" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">2. Guard</text><text x="330" y="385" font-family="Arial" font-size="25" font-weight="400" fill="#172B43">available &gt;= 1; decrement available and increment held</text><text x="115" y="455" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">3. Persist</text><text x="330" y="455" font-family="Arial" font-size="25" font-weight="400" fill="#172B43">Reservation + audit + outbox + original response</text><text x="115" y="525" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">4. Commit</text><text x="330" y="525" font-family="Arial" font-size="25" font-weight="400" fill="#172B43">Only now return 201; unknown commit uses same key</text><rect x="80" y="720" width="820" height="225" rx="10" fill="#E8EFF8" stroke="#647A90" stroke-width="1.5"/><text x="100" y="758" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Last unit: two contenders</text><text x="100" y="793.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">One update commits available=0. The waiting update rechecks the</text><text x="100" y="821.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">predicate and changes zero rows.</text><rect x="1010" y="720" width="830" height="225" rx="10" fill="#DDF2E4" stroke="#647A90" stroke-width="1.5"/><text x="1030" y="758" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Expiry vs checkout</text><text x="1030" y="793.0" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">Both lock the same hold. Checkout pins PAYMENT_PENDING; TTL releases</text><text x="1030" y="821.35" font-family="Arial" font-size="21" font-weight="400" fill="#172B43">only RESERVED.</text><text x="80" y="1025" font-family="Arial" font-size="25" font-weight="700" fill="#172B43">Preserved by every transition: available + held + sold = allocated; every quantity &gt;= 0.</text></svg>