openapi: 3.1.0
info:
  title: SALESTORM Design Contract
  version: 1.0.0
  description: Design contract; no deployed API. Single-unit flash sale assumptions
    apply.
servers:
- url: https://api.salestorm.example/v1
security:
- bearerAuth: []
paths:
  /products/{product_id}:
    get:
      operationId: get_products_product_id
      summary: Read product; stock is advisory
      parameters:
      - name: product_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      responses:
        '200':
          description: Read product; stock is advisory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict, expired, sold out or key mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Admission limit; obey Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Suggested seconds before retry with same key
        '503':
          description: Dependency unavailable; outcome may be unknown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Suggested seconds before retry with same key
