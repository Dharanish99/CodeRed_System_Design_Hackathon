            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict, expired, sold out or key mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Admission limit; obey Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Suggested seconds before retry with same key
        '503':
          description: Dependency unavailable; outcome may be unknown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Suggested seconds before retry with same key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider_event_id:
                  type: string
                provider_ref:
                  type: string
                outcome:
                  type: string
                  enum:
                  - SUCCEEDED
                  - FAILED
                  - PENDING
              required:
              - provider_event_id
              - provider_ref
              - outcome
      security:
      - providerSignature: []
      description: Normalize provider-native payload through adapter after raw-body
        signature validation. This abstract shape is not a vendor webhook specification.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: Provider-Signature
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id: *id001
      required:
      - code
      - message
      - correlation_id
    Product:
      type: object
      additionalProperties: false
      properties:
        product_id: *id001
        name:
          type: string
        price_minor: &id002
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        stock_hint:
          type: string
          enum:
          - AVAILABLE
          - SOLD_OUT
          - UNKNOWN
      required:
      - product_id
      - name
      - price_minor
      - currency
      - stock_hint
    Cart:
      type: object
      additionalProperties: false
      properties:
        cart_id: *id001
        version:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              product_id: *id001
              quantity:
                type: integer
                minimum: 1
            required:
            - product_id
            - quantity
      required:
      - cart_id
      - version
      - items
    Quote:
      type: object
      additionalProperties: false
      properties:
        quote_token:
          type: string
        expires_at:
          type: string
          format: date-time
        amount_minor: *id002
        currency:
          type: string
      required:
      - quote_token
      - expires_at
      - amount_minor
      - currency
    Reservation:
      type: object
      additionalProperties: false
      properties:
        reservation_id: *id001
        state:
          type: string
          enum:
          - RESERVED
          - PAYMENT_PENDING
          - SOLD
          - RELEASED
        expires_at:
          type: string
          format: date-time
        quantity:
          type: integer
          const: 1
      required:
      - reservation_id
      - state
      - expires_at
      - quantity
    Checkout:
      type: object
      additionalProperties: false
      properties:
        checkout_id: *id001
        reservation_id: *id001
        state:
          type: string
          enum:
          - PAYMENT_PENDING
          - SOLD
          - RELEASED
        payment_status_url:
          type: string
      required:
      - checkout_id
      - reservation_id
      - state
      - payment_status_url
    Payment:
      type: object
      additionalProperties: false
      properties:
        payment_id: *id001
        reservation_id: *id001
        status:
          type: string
          enum:
          - PENDING
          - UNKNOWN
          - SUCCEEDED
          - FAILED
          - REFUND_PENDING
          - REFUNDED
      required:
      - payment_id
      - reservation_id
      - status
    Order:
      type: object
      additionalProperties: false
      properties:
        order_id: *id001
        reservation_id: *id001
        status:
          type: string
          enum:
          - CREATED
          - PAYMENT_PENDING
          - CONFIRMED
          - PROCESSING
          - SHIPPED
          - OUT_FOR_DELIVERY
          - DELIVERED
          - CANCELLED
          - REFUND_PENDING
          - REFUNDED
        amount_minor: *id002
        currency:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              product_id: *id001
              quantity:
                type: integer
              unit_price_minor: *id002
            required:
            - product_id
            - quantity
            - unit_price_minor
      required:
      - order_id
      - reservation_id
      - status
      - amount_minor
      - currency
      - items
